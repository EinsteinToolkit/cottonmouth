format = 1

[package]
name = "cottonmouth"
owners = ["et"]
description = """
Cottonmouth: BSSNOK and Z4c spacetime evolution thorns for CarpetX, generated with the Einstein Engine.

Each thorn is named according to: Cottonmouth{formulation}{order}{matter}
Where:
    - formulation is one of BSSNOK or Z4c
    - order is one of 4, 6, 8; corresponding to 4th, 6th, and 8th order stencils
    - matter is either m (matter terms enabled) or v (vacuum)

Gauge wave and linear wave test initial data are also included.
"""
license = "AGPL-3.0-or-later"
homepage = "https://github.com/EinsteinToolkit/cottonmouth"
contact = "https://github.com/EinsteinToolkit/tickets/issues"
readme = "README.md"
arrangement = "Cottonmouth"

[[works-with]]
target = "et/cottonmouth-stack@^2026.5"
note = "Minimal stack for running Cottonmouth codes, including the Cottonmouth examples."

# Dependencies, from the CCL of the thorns at this commit: for each requirement this package
# doesn't meet itself, the package and thorns that meet it in et/cottonmouth-stack 2026.5.0.
# Ranges are patch ranges floored at the versions built with.

[[dependency]]
target = "et/carpetx@~2026.5.0"
needs = ["CarpetX", "ADMBaseX", "TmunuBaseX", "ODESolvers", "Arith", "Loop"]
note = "CarpetX as the driver; the generated sources also include CarpetX/src/timer.hxx by path."

[[dependency]]
target = "et/amrex@~2026.5.0"
needs = ["AMReX"]

[[dependency]]
target = "et/spacetimex@~2026.5.0"
needs = ["NewRadX"]
note = "NewRadX, for radiative boundary conditions."
